# seadrive 데스크톱 앱용 CORS 설정 (라즈베리파이 nginx)
#
# 적용 위치:
#   1) `map` 블록은 http {} 안 (server {} 밖).
#   2) `add_header` ~ `if` 블록은 Seahub(`location /`)와 파일서버(`location /seafhttp`)
#      두 location 안에 모두 넣는다.
#   3) /seafhttp location에는 아래 두 줄도 확인한다 (청크 8MB보다 커야 함):
#        client_max_body_size 64m;
#        proxy_read_timeout 300s;
#
# 쿠키를 쓰지 않으므로 Access-Control-Allow-Credentials는 넣지 않는다.
# Allow-Origin에 $http_origin을 그대로 쓰지 않는다 (전체 허용 금지).

map $http_origin $cors_origin {
    default                   "";
    "http://tauri.localhost"  $http_origin;   # Windows WebView2
    "tauri://localhost"       $http_origin;   # macOS / Linux
    "http://localhost:1420"   $http_origin;   # vite dev
}

# ---- location / 와 location /seafhttp 양쪽에 ----
add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Range, Content-Disposition, X-SEAFILE-OTP" always;
if ($request_method = OPTIONS) { return 204; }
