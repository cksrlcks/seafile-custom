# seadrive 데스크톱 앱용 CORS 설정 (라즈베리파이 nginx)
#
# 적용 위치 (대개 /etc/nginx/sites-available/seafile.conf 또는 conf.d/seafile.conf):
#   1) [A] map 블록은 http {} 안, server {} 밖에 둔다. (sites-available 파일이면 server 블록 위에 적으면 된다.)
#   2) [B] 블록을 Seahub(`location /`)와 파일서버(`location /seafhttp`) 두 location 안에 모두 넣는다.
#   3) [C] 는 /seafhttp location에만 추가한다.
#   적용 후:  sudo nginx -t && sudo systemctl reload nginx
#
# 검증:
#   curl -si -X OPTIONS https://seafile.heavybear-lab.net/api2/auth-token/ \
#     -H 'Origin: http://tauri.localhost' -H 'Access-Control-Request-Method: POST' \
#     -H 'Access-Control-Request-Headers: authorization,content-type'
#   → 204 와 Access-Control-Allow-Origin: http://tauri.localhost 가 "한 줄만" 보여야 한다.
#   curl -si -X OPTIONS https://seafile.heavybear-lab.net/seafhttp/upload-api/x -H 'Origin: http://tauri.localhost' \
#     -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-range,content-disposition'
#   → 마찬가지로 204 + ACAO 한 줄.
#
# 주의:
#   - add_header는 location 안에 쓰면 server 레벨의 add_header(HSTS 등)를 상속하지 않는다. 그런 헤더가 있으면 location 안에 같이 적어 준다.
#   - 쿠키를 쓰지 않으므로 Access-Control-Allow-Credentials 는 넣지 않는다.
#   - Allow-Origin 에 $http_origin 을 그대로 쓰지 않는다 (전체 허용 금지).

# ---------- [A] http {} 레벨 ----------
map $http_origin $cors_origin {
    default                   "";
    "http://tauri.localhost"  $http_origin;   # Windows WebView2
    "tauri://localhost"       $http_origin;   # macOS / Linux
    "http://localhost:1420"   $http_origin;   # vite dev
}

# ---------- [B] location / 와 location /seafhttp 양쪽에 ----------
add_header Access-Control-Allow-Origin   $cors_origin always;
add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Content-Range, Content-Disposition, X-SEAFILE-OTP" always;
add_header Access-Control-Expose-Headers "X-Seafile-OTP" always;
add_header Access-Control-Max-Age        600 always;
if ($request_method = OPTIONS) { return 204; }

# ---------- [C] location /seafhttp 에만 추가 ----------
# Seafile 파일서버가 upload-api 응답에 직접 Access-Control-Allow-Origin: * 를 붙인다.
# nginx 것과 겹치면 브라우저가 "multiple values"로 거부하므로 백엔드 것은 숨긴다.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
client_max_body_size 64m;      # 청크(8MB)보다 넉넉히
proxy_read_timeout   300s;
